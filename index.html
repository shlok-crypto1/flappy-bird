<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4ec0ca">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%90%A5</text></svg>">
<title>Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #1a1a2e;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    overflow: hidden;
    /* stop pull-to-refresh and rubber-banding from firing mid-game */
    overscroll-behavior: none;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap {
    position: relative;
    /* dvh tracks the address bar collapsing; vh doesn't */
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #70c5ce;
    cursor: pointer;
    /* the canvas owns every gesture on it — no scroll, no pinch, no double-tap zoom */
    touch-action: none;
  }

  #lbBtn {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top));
    right: calc(12px + env(safe-area-inset-right));
    z-index: 5;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.35);
    color: #ffd35a;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #lbBtn:active { transform: scale(0.94); }
  /* keep it off the poles while a run is in progress */
  #lbBtn.playing { opacity: 0; pointer-events: none; }

  .overlay {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    /* --vvh tracks the keyboard on iOS, where innerHeight does not change;
       without it the card centres behind the keyboard */
    height: var(--vvh, 100%);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    padding-top: calc(22px + env(safe-area-inset-top));
    padding-bottom: calc(22px + env(safe-area-inset-bottom));
    background: rgba(10, 6, 30, 0.55);
  }
  .overlay.hidden { display: none; }

  .card {
    width: 100%;
    max-width: 360px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 22px;
    background: linear-gradient(165deg, #8b5cf6 0%, #6d28d9 45%, #4c1d95 100%);
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    color: #fff;
    padding: 22px 20px 20px;
    text-align: center;
  }

  .card h1 {
    font-size: 26px;
    letter-spacing: 1px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.25);
    margin-bottom: 6px;
  }

  #nameModal .card p {
    font-size: 14px;
    color: rgba(255,255,255,0.85);
    margin-bottom: 18px;
  }

  #nameInput {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid transparent;
    outline: none;
    font-size: 16px;
    text-align: center;
    margin-bottom: 14px;
    background: rgba(255,255,255,0.92);
    color: #3b2266;
  }
  #nameInput.invalid { border-color: #ff9d9d; }

  .formError {
    font-size: 13px;
    line-height: 1.35;
    color: #ffc9c9;
    margin: -6px 0 12px;
    min-height: 0;
  }
  .formError:empty { margin: 0; }

  .bigBtn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: #ffd35a;
    color: #4c1d95;
    font-weight: bold;
    font-size: 16px;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .bigBtn:active { transform: scale(0.98); }
  .bigBtn:disabled { opacity: 0.5; }

  .closeBtn {
    position: absolute;
    top: 14px;
    right: 16px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.18);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }

  #lbPanel .card { position: relative; padding-top: 20px; }

  .podium {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 14px;
    margin: 16px 0 18px;
    flex: 0 0 auto;
  }
  .podiumSpot { text-align: center; width: 92px; }
  .podiumSpot .rankTag { font-size: 13px; color: rgba(255,255,255,0.75); margin-bottom: 4px; }
  .podiumSpot .avatar {
    width: 58px; height: 58px; margin: 0 auto;
    border: 3px solid rgba(255,255,255,0.55);
    position: relative;
  }
  .podiumSpot.first .avatar { width: 76px; height: 76px; border-color: #ffd35a; }
  .podiumSpot .crown { font-size: 26px; margin-bottom: -8px; }
  .podiumSpot .pName {
    font-size: 12px; font-weight: bold; margin-top: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .podiumSpot .pScore { font-size: 13px; color: #ffd35a; font-weight: bold; }

  .avatar {
    border-radius: 50%;
    background-color: rgba(255,255,255,0.28);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='8.2' r='4' fill='white'/><path d='M4 20c0-4.6 3.6-8.2 8-8.2s8 3.6 8 8.2' fill='white'/></svg>");
    background-repeat: no-repeat;
    background-position: center 62%;
    background-size: 60%;
    flex-shrink: 0;
  }

  /* only the rankings scroll, so PLAY AGAIN stays reachable no matter how
     many players are on the board */
  .lbList {
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: left;
    overflow-y: auto;
    flex: 1 1 auto;
    min-height: 0;
  }
  .lbRow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
  }
  .lbRow .rankNum { width: 18px; font-weight: bold; color: #ffd35a; font-size: 14px; }
  .lbRow .avatar { width: 34px; height: 34px; }
  .lbRow .rName { flex: 1; font-size: 15px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lbRow .rScore { font-size: 15px; font-weight: bold; color: #ffd35a; }
  .lbRow.me { background: rgba(255,211,90,0.22); outline: 2px solid #ffd35a; }

  .lbMeta {
    margin-top: 14px;
    font-size: 13px;
    color: rgba(255,255,255,0.75);
    min-height: 18px;
    flex: 0 0 auto;
  }

  #lbPlayAgain { margin-top: 14px; flex: 0 0 auto; }
  .card h1, #lbPlayAgain, .linkBtn { flex: 0 0 auto; }

  .linkBtn {
    margin-top: 10px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.7);
    text-decoration: underline;
    font-size: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <button id="lbBtn" title="Leaderboard">🏆</button>

  <div id="nameModal" class="overlay">
    <div class="card">
      <h1>FLAPPY BIRD</h1>
      <p>Enter your name to join the leaderboard</p>
      <input id="nameInput" maxlength="16" placeholder="Your name" autocomplete="off" />
      <div id="nameError" class="formError"></div>
      <button id="nameSubmit" class="bigBtn">PLAY</button>
    </div>
  </div>

  <div id="lbPanel" class="overlay hidden">
    <div class="card">
      <button id="lbClose" class="closeBtn">✕</button>
      <h1>LEADERBOARD</h1>
      <div id="lbPodium" class="podium"></div>
      <div id="lbList" class="lbList"></div>
      <div id="lbMeta" class="lbMeta">Loading…</div>
      <button id="lbPlayAgain" class="bigBtn">PLAY AGAIN</button>
      <button id="lbChangeName" class="linkBtn">change name</button>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Logical resolution (game world).
//
// Height is fixed: gap size and fall distance are what make the game hard, so
// every phone must share them or the leaderboard isn't comparing like with
// like. Width follows the phone's aspect ratio instead, which lets the canvas
// fill the screen at a single uniform scale — stretching one axis to fit was
// squashing the bird by up to 18% on tall handsets.
const H = 780;
const W_MIN = 320, W_MAX = 560;
let W = 440;

// Android shrinks innerHeight when the keyboard opens. Measuring that squat
// viewport would snap the world to its widest clamp mid-typing, so remember the
// keyboard-free height and keep using it while an input has focus. Skipping the
// resize outright doesn't work — the auto-focused name field would then freeze
// the very first sizing.
let fullVH = window.innerHeight;

function resize() {
  const vw = window.innerWidth;
  let vh = window.innerHeight;
  const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (typing && vh < fullVH) vh = fullVH;
  else fullVH = vh;

  W = Math.round(Math.min(W_MAX, Math.max(W_MIN, H * (vw / vh))));

  // one scale for both axes, so nothing distorts; letterboxes only at the
  // clamp limits (a phone held sideways)
  const scale = Math.min(vw / W, vh / H);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = Math.round(W * scale) + 'px';
  canvas.style.height = Math.round(H * scale) + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(() => {
  fullVH = window.innerHeight; // the remembered height belongs to the old orientation
  resize();
}, 150));
resize();

// Keep the dialogs inside the area the keyboard leaves visible. iOS reports
// this only through visualViewport — innerHeight stays at the full height.
if (window.visualViewport) {
  const vv = window.visualViewport;
  const trackViewport = () =>
    document.documentElement.style.setProperty('--vvh', vv.height + 'px');
  vv.addEventListener('resize', trackViewport);
  trackViewport();
}

// ---- Game constants ----
const GRAVITY = 1500;        // px/s^2
const FLAP_V = -430;         // px/s impulse
const PIPE_W = 74;
const GAP = 205;             // vertical gap between pipes
const PIPE_SPEED = 175;      // px/s
const PIPE_INTERVAL = 1.5;   // seconds between spawns
const GROUND_H = 96;
const BIRD_R = 17;

// Mattress lines — pillar textures cropped straight from each mattress's quilting fabric,
// with a binding color sampled from that mattress's edge tape for the caps/outline.
const MATTRESSES = [
  { name: 'RESTO',  tex: 'textures/resto.jpg',  base: '#9a9290', dark: '#6e6663' },
  { name: 'SOVA',   tex: 'textures/sova.jpg',   base: '#e9cbb2', dark: '#b98f6c' },
  { name: 'LUMA',   tex: 'textures/luma.jpg',   base: '#c9cdd0', dark: '#2e8a99' },
  { name: 'ULTIMA', tex: 'textures/ultima.jpg', base: '#f0e9dc', dark: '#c2a06c' },
  { name: 'RIVA',   tex: 'textures/riva.jpg',   base: '#efefec', dark: '#a8a8a2' },
];
// How wide one full quilt tile should appear on screen, in CSS pixels. The tile
// holds ~4 motifs, so this puts a ~32px motif on a 74px pole.
const TILE_CSS = 128;

// A photo crop won't tile — its edges don't line up, so repeating it leaves
// seams down the pole. Mirroring the tile into a 2x2 block makes every edge
// meet its own reflection, which tiles cleanly.
function makeSeamlessTile(img) {
  const s = img.width;
  const c = document.createElement('canvas');
  c.width = c.height = s * 2;
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(img, 0, 0);
  g.save(); g.translate(s * 2, 0); g.scale(-1, 1); g.drawImage(img, 0, 0); g.restore();
  g.save(); g.translate(0, s * 2); g.scale(1, -1); g.drawImage(img, 0, 0); g.restore();
  g.save(); g.translate(s * 2, s * 2); g.scale(-1, -1); g.drawImage(img, 0, 0); g.restore();
  return c;
}

// Canvas has no mipmaps, so shrinking a big tile in one jump aliases the weave
// into moire. Halving repeatedly until we're within 2x keeps the stitching clean.
function resampleTo(src, size) {
  let cur = src;
  while (cur.width > size * 2) {
    const half = document.createElement('canvas');
    half.width = half.height = Math.max(size, cur.width >> 1);
    const g = half.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(cur, 0, 0, half.width, half.height);
    cur = half;
  }
  if (cur.width === size) return cur;
  const out = document.createElement('canvas');
  out.width = out.height = size;
  const g = out.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(cur, 0, 0, size, size);
  return out;
}

// Build the fabric at the display's real pixel density so it lands 1:1 on the
// panel instead of being stretched. Pattern space is CSS pixels (the context is
// already scaled by dpr), so a tile of TILE_CSS*dpr drawn at 1/dpr is exact.
let patternDpr = 0;
function buildPatterns() {
  const dpr = window.devicePixelRatio || 1;
  const size = Math.round(TILE_CSS * dpr);
  for (const m of MATTRESSES) {
    if (!m.tile) continue;
    const pat = ctx.createPattern(resampleTo(m.tile, size), 'repeat');
    if (pat.setTransform) pat.setTransform(new DOMMatrix().scale(TILE_CSS / size));
    m.pattern = pat;
  }
  patternDpr = dpr;
}

for (const m of MATTRESSES) {
  const img = new Image();
  img.onload = () => { m.tile = makeSeamlessTile(img); buildPatterns(); };
  img.src = m.tex;
}

// ---- Leaderboard (Supabase) ----
const SUPABASE_URL = 'https://wmgqfehpcathjccexyqa.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtZ3FmZWhwY2F0aGpjY2V4eXFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzA1OTgsImV4cCI6MjEwMjcwNjU5OH0.DLeNohNLu3QuePZmxsMDDcZ2hqiwNUgFowgAdh5MrmM';
const sbHeaders = {
  apikey: SUPABASE_ANON_KEY,
  Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
  'Content-Type': 'application/json',
};

function getDeviceId() {
  let id = localStorage.getItem('fb_device_id');
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    }));
    localStorage.setItem('fb_device_id', id);
  }
  return id;
}
function getPlayerName() { return localStorage.getItem('fb_player_name') || ''; }
function setPlayerName(n) { localStorage.setItem('fb_player_name', n); }

// Writes go through database functions rather than straight at the table, so
// the name check and the claim happen in one step — two people racing for the
// same name can't both win it.
// Phone networks drop out mid-request and a plain fetch will sit there for
// minutes. Every call gets a deadline so the game never hangs waiting on one.
const NET_TIMEOUT = 8000;

async function fetchJson(url, opts = {}) {
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), NET_TIMEOUT);
  try {
    const res = await fetch(url, { ...opts, headers: sbHeaders, signal: ac.signal });
    if (!res.ok) throw new Error(url + ' -> ' + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function rpc(fn, body) {
  return fetchJson(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    body: JSON.stringify(body),
  });
}

// 'ok' | 'taken' | 'invalid'
function claimName(name) {
  return rpc('claim_name', { p_device: getDeviceId(), p_name: name });
}

async function submitScore(finalScore) {
  if (!getPlayerName() || finalScore <= 0) return false;
  try {
    await rpc('submit_score', { p_device: getDeviceId(), p_score: finalScore });
    myRank = await rpc('my_rank', { p_device: getDeviceId() });
    return true;
  } catch (e) {
    // offline or unreachable — score just won't sync this round
    return false;
  }
}

async function fetchLeaderboard(limit) {
  // order explicitly: Postgres does not promise a view's own ORDER BY survives
  // an outer LIMIT, so without this the top 20 could be the wrong 20
  return fetchJson(`${SUPABASE_URL}/rest/v1/leaderboard?select=name,score&order=score.desc&limit=${limit}`);
}

let myRank = null;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function openLeaderboard() {
  document.getElementById('lbPanel').classList.remove('hidden');
  const podiumEl = document.getElementById('lbPodium');
  const listEl = document.getElementById('lbList');
  const metaEl = document.getElementById('lbMeta');
  podiumEl.innerHTML = '';
  listEl.innerHTML = '';
  metaEl.textContent = 'Loading…';

  try {
    const rows = await fetchLeaderboard(20);
    // names are unique now, so they identify the player on their own
    const myName = getPlayerName().toLowerCase();
    const isMe = r => myName && r.name.toLowerCase() === myName;
    const top3 = rows.slice(0, 3);
    const order = [1, 0, 2]; // render as 2nd, 1st, 3rd for the podium look
    for (const i of order) {
      const r = top3[i];
      const spot = document.createElement('div');
      spot.className = 'podiumSpot' + (i === 0 ? ' first' : '');
      if (!r) { spot.style.visibility = 'hidden'; podiumEl.appendChild(spot); continue; }
      spot.innerHTML = `
        ${i === 0 ? '<div class="crown">👑</div>' : `<div class="rankTag">${i + 1}</div>`}
        <div class="avatar"></div>
        <div class="pName">${escapeHtml(r.name)}</div>
        <div class="pScore">${r.score}</div>`;
      podiumEl.appendChild(spot);
    }

    rows.forEach((r, i) => {
      const row = document.createElement('div');
      row.className = 'lbRow' + (isMe(r) ? ' me' : '');
      row.innerHTML = `
        <div class="rankNum">${i + 1}</div>
        <div class="avatar"></div>
        <div class="rName">${escapeHtml(r.name)}${isMe(r) ? ' (you)' : ''}</div>
        <div class="rScore">${r.score}</div>`;
      listEl.appendChild(row);
    });

    const mineIdx = rows.findIndex(isMe);
    if (mineIdx >= 0) {
      metaEl.textContent = `You're #${mineIdx + 1} with ${rows[mineIdx].score}`;
      // your own row is the one you opened this to see — don't make them hunt
      // for it down a scrolled list
      const meRow = listEl.querySelector('.lbRow.me');
      if (meRow) meRow.scrollIntoView({ block: 'center' });
    } else if (best > 0) {
      const rank = await rpc('my_rank', { p_device: getDeviceId() });
      metaEl.textContent = rank ? `You're #${rank} with ${best} (play more to crack the top 20!)` : `Your best is ${best}`;
    } else {
      metaEl.textContent = 'Play a round to join the leaderboard!';
    }
  } catch (e) {
    metaEl.textContent = 'Could not load leaderboard — check your connection.';
  }
}

const lbBtn = document.getElementById('lbBtn');
lbBtn.addEventListener('click', openLeaderboard);
document.getElementById('lbClose').addEventListener('click', () => {
  document.getElementById('lbPanel').classList.add('hidden');
});
document.getElementById('lbPlayAgain').addEventListener('click', () => {
  document.getElementById('lbPanel').classList.add('hidden');
  deathSeq++; // cancel any auto-open still pending from the last death
  reset();
  state = STATE.READY;
});
document.getElementById('lbChangeName').addEventListener('click', () => {
  document.getElementById('lbPanel').classList.add('hidden');
  openNameModal();
});

const nameModal = document.getElementById('nameModal');
const nameInput = document.getElementById('nameInput');
const nameSubmitBtn = document.getElementById('nameSubmit');
const nameErrorEl = document.getElementById('nameError');

function setNameError(msg) {
  nameErrorEl.textContent = msg;
  nameInput.classList.toggle('invalid', !!msg);
}

function openNameModal(msg) {
  nameInput.value = getPlayerName();
  setNameError(msg || '');
  nameModal.classList.remove('hidden');
  setTimeout(() => { nameInput.focus(); nameInput.select(); }, 50);
}

async function confirmName() {
  const v = nameInput.value.trim().slice(0, 16);
  if (!v) { setNameError('Please enter a name.'); nameInput.focus(); return; }

  setNameError('');
  nameSubmitBtn.disabled = true;
  nameSubmitBtn.textContent = 'CHECKING…';
  try {
    const result = await claimName(v);
    if (result === 'taken') {
      setNameError(`"${v}" is already taken. Please choose a different name.`);
      nameInput.focus();
      nameInput.select();
      return;
    }
    if (result === 'invalid') {
      setNameError('Names must be 1–16 characters.');
      nameInput.focus();
      return;
    }
    setPlayerName(v);
    setNameError('');
    nameModal.classList.add('hidden');
  } catch (e) {
    // without a confirmed claim the name isn't ours, so don't let play start
    setNameError('Could not reach the leaderboard. Check your connection and try again.');
  } finally {
    nameSubmitBtn.disabled = false;
    nameSubmitBtn.textContent = 'PLAY';
  }
}

nameSubmitBtn.addEventListener('click', confirmName);
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') confirmName(); });
nameInput.addEventListener('input', () => setNameError(''));
// the keyboard closing frees up viewport again
nameInput.addEventListener('blur', () => setTimeout(resize, 100));

// Re-assert the stored name on load: it confirms the row still exists and
// catches the case where this name got claimed elsewhere first. The modal
// stays up (and so play stays blocked) until the claim comes back.
(async function restoreName() {
  const saved = getPlayerName();
  if (!saved) { openNameModal(); return; }

  nameInput.value = saved;
  nameSubmitBtn.disabled = true;
  nameSubmitBtn.textContent = 'CHECKING…';
  try {
    if (await claimName(saved) === 'ok') {
      nameModal.classList.add('hidden');
      return;
    }
    openNameModal(`"${saved}" is now taken by another player. Please choose a different name.`);
  } catch (e) {
    openNameModal('Could not reach the leaderboard. Check your connection and try again.');
  } finally {
    nameSubmitBtn.disabled = false;
    nameSubmitBtn.textContent = 'PLAY';
  }
})();

// ---- State ----
const STATE = { READY: 0, PLAY: 1, DEAD: 2 };
let state = STATE.READY;
let score = 0, best = 0;
let bird, pipes, spawnTimer, groundX, flashAlpha, mattressCounter;
let lastT = 0;

function reset() {
  bird = { x: W * 0.30, y: H * 0.45, v: 0, rot: 0 };
  pipes = [];
  spawnTimer = 0;
  groundX = 0;
  flashAlpha = 0;
  score = 0;
  mattressCounter = 0;
}
reset();

// Pre-generated cloud positions for parallax
const clouds = [];
for (let i = 0; i < 5; i++) {
  clouds.push({ x: Math.random() * W, y: 60 + Math.random() * 220, s: 0.5 + Math.random() * 0.9 });
}

function spawnPipe() {
  const margin = 70;
  const minTop = margin;
  const maxTop = H - GROUND_H - GAP - margin;
  const top = minTop + Math.random() * (maxTop - minTop);
  const mattress = MATTRESSES[mattressCounter % MATTRESSES.length];
  mattressCounter++;
  pipes.push({ x: W + PIPE_W, top: top, scored: false, mattress: mattress });
}

// ---- Input ----
function inputBlocked() {
  return !document.getElementById('nameModal').classList.contains('hidden')
    || !document.getElementById('lbPanel').classList.contains('hidden');
}

function flap() {
  if (inputBlocked()) return;
  if (state === STATE.READY) {
    state = STATE.PLAY;
    bird.v = FLAP_V;
  } else if (state === STATE.PLAY) {
    bird.v = FLAP_V;
  }
  // DEAD is handled by the leaderboard's PLAY AGAIN button. Restarting on a
  // stray tap here used to race the board and skip it entirely.
}
let deadTimer = 0;

// A tap can raise touchstart *and* a synthesised mousedown, which would flap
// twice and send the bird up at double strength. Once a touch is seen, ignore
// mouse events entirely.
let touchSeen = false;
canvas.addEventListener('touchstart', e => {
  touchSeen = true;
  e.preventDefault();
  flap();
}, { passive: false });
canvas.addEventListener('mousedown', e => {
  if (touchSeen) return;
  e.preventDefault();
  flap();
});
// long-press on the canvas shouldn't raise the OS text/image menu
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (inputBlocked()) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
});

// ---- Update ----
function update(dt) {
  // the world's width follows the viewport, so keep the bird anchored across
  // an orientation change or the address bar collapsing
  bird.x = W * 0.30;

  // ground scroll always animates
  groundX = (groundX - PIPE_SPEED * dt) % 24;
  // clouds drift
  for (const c of clouds) {
    c.x -= 12 * dt * c.s;
    if (c.x < -80) { c.x = W + 40; c.y = 60 + Math.random() * 220; }
  }

  if (state === STATE.READY) {
    // gentle bob
    bird.y = H * 0.45 + Math.sin(performance.now() / 300) * 8;
    bird.rot = 0;
    return;
  }

  if (state === STATE.DEAD) {
    deadTimer += dt;
    // let the bird fall to the ground
    bird.v += GRAVITY * dt;
    bird.y += bird.v * dt;
    const floor = H - GROUND_H - BIRD_R;
    if (bird.y > floor) { bird.y = floor; bird.v = 0; }
    bird.rot = Math.min(Math.PI / 2, bird.rot + 6 * dt);
    if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 3);
    return;
  }

  // PLAYING
  bird.v += GRAVITY * dt;
  bird.y += bird.v * dt;
  // rotation reflects velocity
  bird.rot = Math.max(-0.5, Math.min(Math.PI / 2, bird.v / 500));

  spawnTimer += dt;
  if (spawnTimer >= PIPE_INTERVAL) { spawnTimer -= PIPE_INTERVAL; spawnPipe(); }

  for (const p of pipes) {
    p.x -= PIPE_SPEED * dt;
    if (!p.scored && p.x + PIPE_W < bird.x) {
      p.scored = true;
      score++;
      if (score > best) best = score;
    }
  }
  pipes = pipes.filter(p => p.x + PIPE_W > -10);

  // collisions
  const floor = H - GROUND_H - BIRD_R;
  if (bird.y > floor) { bird.y = floor; die(); return; }
  if (bird.y < BIRD_R) { bird.y = BIRD_R; bird.v = 0; }

  for (const p of pipes) {
    if (bird.x + BIRD_R > p.x && bird.x - BIRD_R < p.x + PIPE_W) {
      if (bird.y - BIRD_R < p.top || bird.y + BIRD_R > p.top + GAP) { die(); return; }
    }
  }
}

let deathSeq = 0;

function die() {
  state = STATE.DEAD;
  deadTimer = 0;
  flashAlpha = 0.7;
  myRank = null;

  // Send the score, but hold the leaderboard back until the player has had a
  // beat to see GAME OVER. Skip it if they've already restarted by then.
  const thisDeath = ++deathSeq;
  Promise.all([
    submitScore(score),
    new Promise(r => setTimeout(r, 1200)),
  ]).then(() => {
    if (thisDeath === deathSeq && state === STATE.DEAD) openLeaderboard();
  });
}

// ---- Draw ----
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4ec0ca');
  g.addColorStop(1, '#a7e8ec');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // clouds
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (const c of clouds) {
    const r = 22 * c.s;
    ctx.beginPath();
    ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
    ctx.arc(c.x + r, c.y + 6, r * 0.8, 0, Math.PI * 2);
    ctx.arc(c.x - r, c.y + 8, r * 0.7, 0, Math.PI * 2);
    ctx.arc(c.x + r * 0.4, c.y - 8, r * 0.75, 0, Math.PI * 2);
    ctx.fill();
  }
}

const LABEL_SIZE = 26;

function drawMattressLabel(name, x, y, h) {
  // the name runs along the pole, so a short stub can't hold it legibly
  if (h < 110) return;
  ctx.save();
  ctx.translate(x, y + h / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.font = `bold ${LABEL_SIZE}px 'Trebuchet MS', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 5;
  ctx.strokeStyle = 'rgba(48,36,10,0.75)';
  ctx.fillStyle = '#fff';
  ctx.strokeText(name, 0, 0);
  ctx.fillText(name, 0, 0);
  ctx.restore();
}

// Gradient coords are resolved against the transform in effect when it's painted,
// so this is built once and lines up with whichever pole we've translated to.
const poleShade = ctx.createLinearGradient(0, 0, PIPE_W, 0);
poleShade.addColorStop(0, 'rgba(0,0,0,0.22)');
poleShade.addColorStop(0.22, 'rgba(255,255,255,0.14)');
poleShade.addColorStop(0.55, 'rgba(255,255,255,0.03)');
poleShade.addColorStop(1, 'rgba(0,0,0,0.26)');

function drawPipe(p) {
  const capH = 26, capOver = 5;
  const m = p.mattress;
  const topH = p.top - capH;
  const by = p.top + GAP;
  const botY = by + capH;
  const botH = H - GROUND_H - botY;

  ctx.save();
  // draw in the pillar's own local space so the fabric pattern stays fixed to the
  // pillar (like a wrapped panel) instead of sliding as it scrolls across the world
  ctx.translate(p.x, 0);

  ctx.fillStyle = m.pattern || m.base;
  ctx.fillRect(0, 0, PIPE_W, topH);
  ctx.fillRect(0, botY, PIPE_W, botH);

  // binding tape at the cap edges, matching the real mattress trim color
  ctx.fillStyle = m.dark;
  ctx.fillRect(-capOver, p.top - capH, PIPE_W + capOver * 2, capH);
  ctx.fillRect(-capOver, by, PIPE_W + capOver * 2, capH);

  // strong dark outlines for readability against the sky
  ctx.strokeStyle = m.dark;
  ctx.lineWidth = 3;
  ctx.strokeRect(0, 0, PIPE_W, topH);
  ctx.strokeRect(-capOver, p.top - capH, PIPE_W + capOver * 2, capH);
  ctx.strokeRect(0, botY, PIPE_W, botH);
  ctx.strokeRect(-capOver, by, PIPE_W + capOver * 2, capH);

  // round the pole with edge shading instead of a hard white stripe, so the
  // quilting stays readable all the way across
  ctx.fillStyle = poleShade;
  ctx.fillRect(0, 0, PIPE_W, topH);
  ctx.fillRect(0, botY, PIPE_W, botH);

  // mattress name labels
  drawMattressLabel(m.name, PIPE_W / 2, 0, topH);
  drawMattressLabel(m.name, PIPE_W / 2, botY, botH);

  ctx.restore();
}

function drawGround() {
  const y = H - GROUND_H;
  ctx.fillStyle = '#ded895';
  ctx.fillRect(0, y, W, GROUND_H);
  // grass strip
  ctx.fillStyle = '#79c14a';
  ctx.fillRect(0, y, W, 14);
  ctx.fillStyle = '#5aa832';
  ctx.fillRect(0, y + 14, W, 4);
  // dirt hatching (scrolls)
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  for (let x = groundX; x < W; x += 24) {
    ctx.fillRect(x, y + 22, 12, GROUND_H - 22);
  }
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);

  // body
  ctx.fillStyle = '#f6d33c';
  ctx.strokeStyle = '#b8860b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, BIRD_R + 2, BIRD_R, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // belly
  ctx.fillStyle = '#fcefc0';
  ctx.beginPath();
  ctx.ellipse(-2, 5, BIRD_R * 0.7, BIRD_R * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();

  // wing (flaps with vertical velocity)
  const wingUp = Math.sin(performance.now() / 60) * 4;
  ctx.fillStyle = '#f0b429';
  ctx.strokeStyle = '#b8860b';
  ctx.beginPath();
  ctx.ellipse(-4, 2 + (state === STATE.PLAY ? wingUp : 0), 9, 6, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // eye
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(9, -6, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(11, -6, 3, 0, Math.PI * 2);
  ctx.fill();

  // beak
  ctx.fillStyle = '#f26a2e';
  ctx.strokeStyle = '#c0491a';
  ctx.beginPath();
  ctx.moveTo(15, -1);
  ctx.lineTo(28, 2);
  ctx.lineTo(15, 7);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function drawText(txt, x, y, size, fill, stroke) {
  ctx.font = `bold ${size}px 'Trebuchet MS', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = size / 8;
  ctx.strokeStyle = stroke;
  ctx.fillStyle = fill;
  ctx.strokeText(txt, x, y);
  ctx.fillText(txt, x, y);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  drawBackground();
  for (const p of pipes) drawPipe(p);
  drawGround();
  drawBird();

  // score during play
  if (state === STATE.PLAY) {
    drawText(score, W / 2, 90, 56, '#fff', '#4a3b12');
  }

  // ready screen
  if (state === STATE.READY) {
    drawText('FLAPPY BIRD', W / 2, H * 0.22, 46, '#fff', '#2c6b70');
    // instruction card
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    roundRect(W / 2 - 130, H * 0.55, 260, 92, 16); ctx.fill();
    drawText('TAP / CLICK / SPACE', W / 2, H * 0.55 + 34, 22, '#fff', 'rgba(0,0,0,0.3)');
    drawText('to flap', W / 2, H * 0.55 + 64, 20, '#ffe27a', 'rgba(0,0,0,0.3)');
    if (best > 0) drawText('Best: ' + best, W / 2, H * 0.40, 26, '#fff', '#2c6b70');
  }

  // death flash
  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  // game over screen
  if (state === STATE.DEAD) {
    drawText('GAME OVER', W / 2, H * 0.30, 44, '#fff', '#8a3b1e');
    // panel
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    roundRect(W / 2 - 130, H * 0.40, 260, 196, 18); ctx.fill();
    ctx.font = "bold 22px 'Trebuchet MS', sans-serif";
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffe27a';
    ctx.fillText('SCORE', W / 2 - 100, H * 0.40 + 46);
    ctx.fillText('BEST', W / 2 - 100, H * 0.40 + 104);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = "bold 40px 'Trebuchet MS', sans-serif";
    ctx.fillText(score, W / 2 + 100, H * 0.40 + 50);
    ctx.fillText(best, W / 2 + 100, H * 0.40 + 108);

    ctx.font = "16px 'Trebuchet MS', sans-serif";
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const rankTxt = (!getPlayerName() || score <= 0) ? '' : myRank ? `Global rank #${myRank}` : 'Syncing rank…';
    if (rankTxt) ctx.fillText(rankTxt, W / 2, H * 0.40 + 172);
  }
}

// ---- Loop ----
function loop(t) {
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.05) dt = 0.05; // clamp after tab switches
  // browser zoom or a move to another monitor changes pixel density
  if ((window.devicePixelRatio || 1) !== patternDpr) buildPatterns();
  lbBtn.classList.toggle('playing', state === STATE.PLAY);
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
